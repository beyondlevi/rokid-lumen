<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, initial-scale=1">
<title>Camera test</title>
<style>
  html, body { margin: 0; background: #000; color: #fff; font: 22px/1.3 sans-serif; }
  main { width: 600px; height: 600px; box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 10px; }
  button, label.btn { flex: 1; height: 64px; border-radius: 32px; border: 2px solid rgba(255,255,255,.45); background: #000; color: #fff; font: inherit; display: flex; align-items: center; justify-content: center; }
  button:focus, label.btn:focus-within { outline: none; border: 3px solid rgba(255,255,255,.9); background: #111113; }
  #view { position: relative; flex: 1; border-radius: 16px; overflow: hidden; background: #121212; }
  video, img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #status { font-size: 18px; color: #cfd3d9; min-height: 48px; white-space: pre-wrap; }
  input[type=file] { position: absolute; opacity: 0; width: 1px; height: 1px; }
</style>
</head>
<body>
<main>
  <div class="row">
    <button id="start">Live camera</button>
    <button id="shot">Take photo</button>
  </div>
  <div class="row">
    <label class="btn" id="pick">Photo (file input)<input id="file" type="file" accept="image/*" capture="environment"></label>
  </div>
  <div id="view"><video id="video" autoplay playsinline muted></video><img id="still" alt=""></div>
  <div id="status">Ready</div>
</main>
<script>
  const $ = id => document.getElementById(id);
  const status = text => { $('status').textContent = text; console.info('[camera-test] ' + text); };
  let stream = null;
  $('start').onclick = async () => {
    try {
      status('Asking for the camera…');
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
      const track = stream.getVideoTracks()[0];
      $('still').removeAttribute('src');
      $('video').srcObject = stream;
      const s = track.getSettings();
      status('Live: ' + track.label + ' ' + (s.width || '?') + 'x' + (s.height || '?') + ' @' + (s.frameRate || '?'));
    } catch (e) { status('getUserMedia failed: ' + e.name + ': ' + e.message); }
  };
  $('shot').onclick = () => {
    const v = $('video');
    if (!v.videoWidth) return status('No live video to capture');
    const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    c.toBlob(b => { $('still').src = URL.createObjectURL(b); status('Photo from video: ' + c.width + 'x' + c.height + ', ' + Math.round(b.size / 1024) + ' KB'); }, 'image/jpeg', 0.85);
  };
  // The band's index tap on the label: open the file input (Enter on a label doesn't).
  $('pick').tabIndex = 0;
  $('pick').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('file').click(); } });
  $('file').onchange = () => {
    const f = $('file').files[0];
    if (!f) return status('File input: nothing chosen');
    $('video').srcObject = null; $('still').src = URL.createObjectURL(f);
    status('File input: ' + f.name + ' ' + f.type + ' ' + Math.round(f.size / 1024) + ' KB');
  };
  $('file').addEventListener('cancel', () => status('File input: cancelled'));
  // D-pad: the arrows move the focus between the three controls (Enter clicks the focused one).
  const order = ['start', 'shot', 'pick'];
  document.addEventListener('keydown', e => {
    const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (!step) return;
    e.preventDefault();
    const at = order.indexOf(document.activeElement && document.activeElement.id);
    const next = order[(at + step + order.length) % order.length];
    $(next).focus();
  });
  $('start').focus();
</script>
</body>
</html>
