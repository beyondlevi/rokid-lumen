# A tag v<version> builds both apps signed with the release key and drafts a GitHub release
# with the APKs and their SHA-256. Publishing the draft is a person's decision; once published,
# the companion's updater offers it (UpdateManager).
#
# Secrets: KEYSTORE_BASE64 (the release keystore, base64), KEYSTORE_PASSWORD, KEY_ALIAS,
# KEY_PASSWORD.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: 30.0.16248370
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust bridge (arm64)
        run: |
          cargo install cargo-ndk --locked
          ./build-rust.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Signed builds
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # No VERSION_CODE: it comes from the tag (versionCodeOf in the build scripts), so it grows with
          # the version and the in-app updater's installs are never downgrades.
        run: ./gradlew --no-daemon :app:testDebugUnitTest :phone:testDebugUnitTest :app:assembleRelease :phone:assembleRelease

      - name: APKs and checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/rokid-lumen-glasses-$version.apk"
          cp phone/build/outputs/apk/release/phone-release.apk "dist/rokid-lumen-companion-$version.apk"
          for apk in dist/*.apk; do "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk"; done
          (cd dist && sha256sum -- *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes are the CHANGELOG section of this version ("## [0.1.0] ..." up to the next "## ").
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## [" v "]") == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          # A tag with a suffix (v0.2.0-beta.5) is a pre-release: the companion offers it only with
          # "Include beta versions" on. Drafts aren't seen by the updater until published.
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* --draft $pre --title "Rokid Lumen ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
