<!doctype html>
<meta charset="utf-8">
<title>Grid</title>
<style>
  body { margin: 0; background: #000; color: #fff; font: 16px sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(3, 160px); gap: 20px; padding: 20px; }
  .grid button { height: 80px; }
</style>
<div class="grid">
  <button id="g1">1</button><button id="g2">2</button><button id="g3">3</button>
  <button id="g4">4</button><button id="g5">5</button><button id="g6">6</button>
  <button id="g7">7</button><button id="g8">8</button><button id="g9">9</button>
</div>
